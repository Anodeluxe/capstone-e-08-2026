# ─────────────────────────────────────────────────────────────────────────────
# Toren Monitoring — Reverse proxy (HTTP)
#
# Satu origin untuk frontend + API + WebSocket → CORS jadi non-issue.
#
#   /       → frontend (Next.js standalone, container "frontend":3000)
#   /api/   → backend  (FastAPI, container "backend":8000)
#   /ws     → backend  (WebSocket, wajib upgrade header + timeout panjang)
#
# Untuk HTTPS, pakai deploy/nginx-tls.conf (butuh sertifikat certbot).
# ─────────────────────────────────────────────────────────────────────────────

upstream toren_frontend {
    server frontend:3000;
}

upstream toren_backend {
    server backend:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Health check nginx
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://toren_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── REST API ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://toren_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Health check backend (tanpa prefix /api) ────────────────────────────
    location = /health {
        proxy_pass http://toren_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket ────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://toren_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout panjang supaya koneksi tidak putus tiap 60 detik
        # (frontend auto-reconnect → reconnect loop).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

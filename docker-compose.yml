# ─────────────────────────────────────────────────────────────────────────────
# Toren Monitoring — Docker Compose
#
#   docker compose up -d
#       → hanya infrastruktur (TimescaleDB + Mosquitto). Dipakai untuk
#         development backend/frontend jalan di host (venv + npm run dev).
#
#   docker compose --profile app up -d --build
#       → infrastruktur + backend + frontend + nginx (stack produksi lengkap).
#         Semua app service memakai profile "app" supaya tidak ikut jalan
#         pada development.
#
# Detail penting:
#   * Port DB (5432) dan backend (8000) di-bind ke 127.0.0.1 → hanya bisa
#     diakses dari server itu sendiri, tidak terekspos ke internet.
#   * Port MQTT (1883) dibiarkan publik karena ESP32 harus konek dari luar.
# ─────────────────────────────────────────────────────────────────────────────

name: toren-monitoring

services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: toren_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toren_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      # Host-only: untuk development (backend jalan di host).
      # Di produksi, hapus baris ini agar DB hanya reachable via jaringan internal.
      - "127.0.0.1:5432:5432"
    volumes:
      - toren_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-toren_db}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [toren]

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: toren_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"   # ESP32 → broker (WAJIB bisa diakses dari luar)
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      # Publish dummy message untuk memastikan broker menerima koneksi.
      # (tidak reliant pada topik $SYS yangintervalnya 10 detik)
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t 'healthcheck' -m ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [toren]

  # ── Profile "app" — stack produksi ─────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: toren-backend:latest
    container_name: toren_backend
    restart: unless-stopped
    profiles: ["app"]
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Hostname = nama service (bukan localhost) karena backend jadi container.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@timescaledb:5432/${POSTGRES_DB:-toren_db}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@timescaledb:5432/${POSTGRES_DB:-toren_db}
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    extra_hosts:
      # Supaya backend bisa menjangkau WAHA yang jalan di host server.
      - "host.docker.internal:host-gateway"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      # Host-only — Nginx yang mengekspos ke publik.
      - "127.0.0.1:8005:8005"
    networks: [toren]

volumes:
  toren_db_data:

networks:
  toren:
    driver: bridge
